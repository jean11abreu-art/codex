[build]
  command = "npm run build"
  publish = "premium-flex-site"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/catalogo-premiumflex.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = 'attachment; filename="Catalogo-Premiumflex.pdf"'
